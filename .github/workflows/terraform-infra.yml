name: Terraform Infra Deployment

on:
    # push:
    #     branches: [main]
    #     paths:
    #         - "terraform/**"
    workflow_dispatch:

jobs:
    terraform:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: terraform

        steps:
            - name: Checkout
                uses: actions/checkout@v2

            - name: Azure Login
                uses: azure/login@v2
                with:
                    creds: ${{ secrets.CONTAINERAPPBRITEDGE_AZURE_CREDENTIALS }}

            - name: Setup Terraform
                uses: hashicorp/setup-terraform@v3

            - name: Terraform Init
                run: terraform init

            - name: Terraform Plan
                run: terraform plan

            - name: Terraform Apply
                run: terraform apply -auto-approve
