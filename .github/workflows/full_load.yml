name: Full Load - Terraform + Container App Deploy

on:
    workflow_dispatch:

jobs:
    terraform:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: terraform

        steps:
            - name: Checkout repo
              uses: actions/checkout@v2

            - name: Azure Login
              uses: azure/login@v2
              with:
                creds: ${{ secrets.CONTAINERAPPBRITEDGE_AZURE_CREDENTIALS }}

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3

            - name: Terraform Init
              run: terraform init

            - name: Terraform Plan
              run: terraform plan

            - name: Terraform Apply
              run: terraform apply -auto-approve

    build-and-deploy:
        needs: terraform
        runs-on: ubuntu-latest

        steps:
            - name: Checkout to the branch
              uses: actions/checkout@v2

            - name: Azure Login
              uses: azure/login@v2
              with:
                  creds: ${{ secrets.CONTAINERAPPBRITEDGE_AZURE_CREDENTIALS }}

            - name: Docker login to ACR
              uses: azure/docker-login@v1
              with:
                  login-server: BritEdgeRegistry.azurecr.io
                  username: ${{ secrets.CONTAINERAPPBRITEDGE_REGISTRY_USERNAME }}
                  password: ${{ secrets.CONTAINERAPPBRITEDGE_REGISTRY_PASSWORD }}

            - name: Build and push image to ACR
              run: |
                  docker build -t BritEdgeRegistry.azurecr.io/britedgejobapp1:latest .
                  docker push BritEdgeRegistry.azurecr.io/britedgejobapp1:latest

            - name: Install containerapp extension
              run: |
                az extension add --name containerapp --upgrade

            - name: Bootstrap container app if it doesn't exist yet
              run: |
                if ! az containerapp show -n jobschedule-app-britedge -g BritEdge_DEV_RG -o none 2>/dev/null; then
                  echo "Container app not found - creating a bare version first (Container Apps can't resolve Key Vault secrets for an identity in the same call that assigns it)."
                  IDENTITY_ID=$(az identity show --name container-user-identity --resource-group BritEdge_DEV_RG --query id -o tsv)
                  az containerapp create -n jobschedule-app-britedge -g BritEdge_DEV_RG \
                    --environment container-app-env-britedge \
                    --image britedgeregistry.azurecr.io/britedgejobapp1:latest \
                    --registry-server britedgeregistry.azurecr.io \
                    --user-assigned "$IDENTITY_ID" \
                    --registry-identity "$IDENTITY_ID" \
                    --ingress external --target-port 8080

                  az containerapp identity assign -n jobschedule-app-britedge -g BritEdge_DEV_RG \
                    --user-assigned "$IDENTITY_ID"
                else
                  echo "Container app already exists - skipping bootstrap, going straight to the full update below."
                fi

            - name: Resolve identity ID and inject into containerapp.yml
              run: |
                IDENTITY_ID=$(az identity show --name container-user-identity --resource-group BritEdge_DEV_RG --query id -o tsv)
                sed -i "s|__CONTAINER_IDENTITY_ID|$IDENTITY_ID|g" .github/containerapp.yml

            - name: Deploy Container App
              uses: azure/container-apps-deploy-action@v2
              with:
                containerAppName: jobschedule-app-britedge
                resourceGroup: BritEdge_DEV_RG
                yamlConfigPath: .github/containerapp.yml
