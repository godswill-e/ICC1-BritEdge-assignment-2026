name: Trigger auto deployment for container-app-britedge

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/container-app-britedge-AutoDeployTrigger-1935a39f-ed77-4d5d-8093-8456972112c6.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.CONTAINERAPPBRITEDGE_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.CONTAINERAPPBRITEDGE_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.CONTAINERAPPBRITEDGE_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: britedgejobapp1.azurecr.io
          registryUsername: ${{ secrets.CONTAINERAPPBRITEDGE_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.CONTAINERAPPBRITEDGE_REGISTRY_PASSWORD }}
          containerAppName: container-app-britedge
          resourceGroup: BritEdge_DEV_RG
          imageToBuild: britedgejobapp1.azurecr.io/container-app-britedge:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


