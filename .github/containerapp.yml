name: jobschedule-app-britedge
resourceGroup: BritEdge_DEV_RG
location: italynorth
identity:
    type: UserAssigned
    userAssignedIdentities:
      __CONTAINER_IDENTITY_ID: {}
kind: containerapps

properties:
    managedEnvironmentId: /subscriptions/1d7f1b24-3cc5-453c-a65e-967a617536b9/resourceGroups/BritEdge_DEV_RG/providers/Microsoft.App/managedEnvironments/container-app-env-britedge
    configuration:
        registries:
        - identity: __CONTAINER_IDENTITY_ID
          server: britedgeregistry.azurecr.io
        ingress:
          external: true
          allowInsecure: false
          targetPort: 8080
        activeRevisionsMode: Single

        secrets:
            - name: cosmos-key
              keyVaultUrl: https://britedge-keyvault-gg.vault.azure.net/secrets/cosmos-key
              identity: __CONTAINER_IDENTITY_ID
            - name: cosmos-endpoint
              keyVaultUrl: https://britedge-keyvault-gg.vault.azure.net/secrets/cosmos-endpoint
              identity: __CONTAINER_IDENTITY_ID

    template:
        containers:
            - name: jobschedule-webapp
              image: britedgeregistry.azurecr.io/britedgejobapp1:latest
              imageType: ContainerImage
              resources:
                  cpu: 0.25
                  memory: 0.5Gi
              env:
                  - name: COSMOS_KEY
                    secretRef: cosmos-key
                  - name: COSMOS_ENDPOINT
                    secretRef: cosmos-endpoint
        scale:
            minReplicas: 0
            maxReplicas: 3
            rules:
                - name: http-scale-rule
                  http:
                      metadata:
                          concurrentRequests: "10"
tags:
    Environment: Dev
    Service: Container App

type: Microsoft.App/containerApps
