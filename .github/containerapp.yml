name: container-app-britedge
resourceGroup: BritEdge_DEV_RG
location: italynorth
identity:
    type: SystemAssigned
kind: containerapps

properties:
    managedEnvironmentId: /subscriptions/1d7f1b24-3cc5-453c-a65e-967a617536b9/resourceGroups/BritEdge_DEV_RG/providers/Microsoft.App/managedEnvironments/container-app-env-britedge
    configuration:
        registries:
        - identity: ""
          server: britedgeregistry.azurecr.io
          username: BritEdgeRegistry
          passwordSecretRef: acr-password
        ingress:
          external: true
          allowInsecure: false
          targetPort: 8080
        activeRevisionsMode: Single

        secrets:
            - name: acr-password
              value: __ACR_PASSWORD__

    template:
        containers:
            - name: jobschedule-webapp
              image: britedgeregistry.azurecr.io/britedgejobapp1:latest
              imageType: ContainerImage
              resources:
                  cpu: 0.25
                  memory: 0.5Gi
              env:
                  - name: COSMOS_KEY
                    value: __COSMOS_KEY__
                  - name: COSMOS_ENDPOINT
                    value: __COSMOS_ENDPOINT__
tags:
    Environment: Dev
    Service: Container App

type: Microsoft.App/containerApps
